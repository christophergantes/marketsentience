[project]
name = "backend"
version = "0.1.0"
description = "Backend for marketsentience"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.2",
    "massive>=2.0.2",
    "psycopg[binary]>=3.2.10",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.43",
    "torch>=2.8.0",
    "transformers>=4.56.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
]
